# Stale patterns — 偵測過時 model name without proper historical qualifier
# NOTE: qualifier_terms include both English ('baseline') and the localized CJK
# forms ('基線' / '基线') because mirror locales (.en.md / .zh-Hans.md) are now
# scanned — a qualifier written as "baseline" in zh-TW/en often becomes "基线" in
# the zh-Hans mirror, and the gate must recognize all three (2026-07 gap).
stale_patterns:
  # Stage 01 completed its 2026-08-27 refresh. These patterns are deliberately
  # scoped to its three mirrors so later stages can migrate in their own PRs.
  - pattern: 'Gemini 3\.5 (Flash|Pro)'
    include_files: ['stages/01-llm-basics.md']
    qualifier_terms: ['前身', '歷史', '历史', '舊版', '旧版', 'legacy', 'historical', 'replaced', 'superseded']
    note: 'Stage 01 recommends Gemini 3.7 Flash; Gemini 3.1 Pro remains Preview'

  - pattern: 'GLM-5\.2'
    include_files: ['stages/01-llm-basics.md']
    qualifier_terms: ['前身', '歷史', '历史', '舊版', '旧版', 'legacy', 'historical', 'replaced', 'superseded']
    note: 'Stage 01 recommends GLM-5.3'

  - pattern: 'Hunyuan T1|TurboS'
    include_files: ['stages/01-llm-basics.md']
    qualifier_terms: ['前身', '歷史', '历史', '舊', '旧', 'legacy', 'historical', 'migrated', 'migration', 'closed', '關閉', '关闭', '遷移', '迁移']
    note: 'Tencent migrated or closed the former Hunyuan model line; Stage 01 recommends Hy3'

  - pattern: 'hy3-preview'
    include_files: ['stages/01-llm-basics.md']
    qualifier_terms: ['sunset', 'shutdown', 'shuts down', '2026-08-31', '下線', '下线', '歷史', '历史', 'legacy']
    note: 'Tencent schedules hy3-preview to shut down on 2026-08-31; Stage 01 recommends Hy3'

  - pattern: 'deepseek-chat|deepseek-reasoner'
    include_files: ['stages/01-llm-basics.md']
    qualifier_terms: ['前身', '歷史', '历史', '舊', '旧', 'legacy', 'historical', 'deprecated', '棄用', '弃用', '停用']
    note: 'DeepSeek retired the old aliases on 2026-07-24'

  - pattern: 'Claude 3\.5 Sonnet'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', '原始', 'baseline', '基線', '基线', 'predecessor', 'history']
    note: 'Pre-2026 Claude version (Claude 3.5 Sonnet was current circa 2024-Q4)'

  - pattern: 'Claude 3 Opus'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', '原始', 'baseline', '基線', '基线']
    note: 'Pre-2025 Claude version'

  - pattern: 'gpt-4o|GPT-4o'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', '原始', 'baseline', '基線', '基线', '對照', 'predecessor']
    note: 'Pre-GPT-5 OpenAI flagship (GPT-4o was current 2024-mid through 2025-summer)'

  - pattern: 'GPT-4(?!\.|o|\-|\d)'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', '原始', 'baseline', '基線', '基线']
    note: 'Plain GPT-4 reference, likely stale'

  - pattern: 'Gemini 1\.5|Gemini 2\.0|Gemini 2\.5(?! Thinking)'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', 'baseline', '基線', '基线']
    note: 'Pre-Gemini 3 Google flagship'

  - pattern: 'DeepSeek[- ]R1(?!-Distill)'  # [- ] catches both 'DeepSeek-R1' and space-form 'DeepSeek R1'
    qualifier_terms: ['前身', '歷史', 'lineage', '原始', 'baseline', '基線', '基线', 'paper', 'method']
    note: '2025-01 DeepSeek reasoning model (superseded by DeepSeek-V4, 2026-04; R2 was rumored but never shipped)'

  - pattern: 'DeepSeek-V3(?!\.)'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', 'baseline', '基線', '基线']
    note: 'Pre-V4 DeepSeek base model'

  - pattern: 'o1-preview|o1-mini'
    qualifier_terms: ['前身', '歷史', 'lineage', '原始', 'baseline', '基線', '基线']
    note: 'Early OpenAI reasoning preview (Sep 2024)'

  - pattern: 'Opus 4\.7'
    qualifier_terms: ['前身', '歷史', 'lineage', '舊版', '原始', 'baseline', '基線', '基线', 'predecessor', 'history']
    note: 'Opus 4.8 (May 2026) supersedes 4.7. Opus 5 (2026-07-24) is now the recommended Opus-class default, but Opus 4.8 stays ACTIVE (not deprecated) and is deliberately NOT listed as a stale pattern'

  # --- MCP Python SDK (added 2026-08 after the v2 breakage) -------------------
  # The 2026-07-28 spec revision itself is invisible to a learner, but the SDK
  # released the same day was NOT: `pip install mcp` started resolving to 2.x,
  # and the repo's only runnable MCP tutorial died on the import line. These two
  # patterns are what a reader would actually hit, so they are what we watch.
  - pattern: 'from mcp\.server import Server|@app\.list_tools\(\)|@app\.call_tool\(\)'
    qualifier_terms: ['v1', 'V1', '前身', '歷史', '历史', 'lineage', '舊版', '旧版',
                      'legacy', 'migration', '遷移', '迁移', 'deprecated', '已失效']
    note: 'MCP Python SDK v1 API. v2.0.0 (2026-07-28) moved the low-level Server handlers to constructor params; teach MCPServer + @app.tool() instead'

  - pattern: 'pip install mcp(?![-"\w])'
    qualifier_terms: ['裸寫', '裸写', 'bare', '會裝到', '会装到', 'gets you', '⚠️',
                      'v1', '鎖版本', '锁版本', 'pin']
    note: 'Unpinned MCP SDK install — v2.0.0 is a breaking change, so teach pip install "mcp>=2,<3" (quoting the bare form inside a warning is fine and is what the qualifier terms allow)'

# Stale date-bound framing — 時間性過時用詞
# 注意：用 \s* 而不是字面 space、因為中文常寫 "2025年" 沒空格
stale_date_phrases:
  - pattern: '2025\s*(年|下半年)?\s*(才|新|剛).*?(發表|釋出|出|推出|公布)'
    note: '"newly released in 2025" framing (now historical in 2026)'

  - pattern: '2024\s*(剛|新|最新).*?(發表|釋出|推出)'
    note: '"newly released in 2024" framing (now historical in 2026)'

  - pattern: '剛發表|剛推出|剛釋出|新發表|甫推出'
    qualifier_terms: ['2026', '本月', '上月', '今年']
    note: 'Time-bound "newly released" without 2026 anchor'

# Files to skip entirely
exclude_files:
  - 'CHANGELOG.md'
  - 'CONTRIBUTORS.md'
  - 'archives/**'
  - '.ai/**'
  - 'book/**'

# Files where pre-2026 model refs are expected (don't warn)
exclude_files_pattern_specific:
  # Stage 6's reasoning lineage table is supposed to mention R1 as predecessor
  - file: 'stages/06-memory-rag.md'
    qualifier_window: 5  # widen qualifier search to ±5 lines for this file (default ±2)

# Context window — how many lines around a match to check for qualifier terms
qualifier_context_lines: 2
