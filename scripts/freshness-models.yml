  # installation paths and avoid freezing account-specific prices or credits.
  - pattern: 'npm install -g @anthropic-ai/claude-code|Node\.js\s*(?:v?18|18\+)'
    include_files: ['resources/setup-guide.md']
    qualifier_terms: []
    note: 'Claude Code now recommends native installers; npm is optional and no longer a Node 18 path'

  - pattern: '1000 credits?|free (?:for )?(?:one|a) week|免費一週|免费一周|暫無原生 desktop app|暂无原生 desktop app|no native desktop app'
    include_files: ['resources/setup-guide.md', 'examples/README.md']
    qualifier_terms: []
    note: 'Beginner entry pages must not freeze volatile account grants or stale desktop availability'

  - pattern: 'https://codeium\.com/windsurf'
    include_files: ['resources/agent-paradigms.md']
    qualifier_terms: []
