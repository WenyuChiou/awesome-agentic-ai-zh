    note: 'Stage 07 must teach benchmark literacy without freezing a model score or ranking'

  - pattern: 'Fable 5|Mythos 5|Opus 4\.8'
    include_files: ['stages/07-multi-agent-production.md']
    qualifier_terms: []
    note: 'Do not duplicate fast-changing model availability or benchmark claims in the Stage 07 production chapter'

  - pattern: '★\s*\d'
    include_files: ['stages/07-multi-agent-production.md']
    qualifier_terms: []
    note: 'Keep editorial ratings but do not freeze volatile GitHub star counts in Stage 07'

  # --- MCP Python SDK (added 2026-08 after the v2 breakage) -------------------
  # The 2026-07-28 spec revision itself is invisible to a learner, but the SDK
  # released the same day was NOT: `pip install mcp` started resolving to 2.x,
  # and the repo's only runnable MCP tutorial died on the import line. These two
  # patterns are what a reader would actually hit, so they are what we watch.
  - pattern: 'from mcp\.server import Server|@app\.list_tools\(\)|@app\.call_tool\(\)'
    qualifier_terms: ['v1', 'V1', '前身', '歷史', '历史', 'lineage', '舊版', '旧版',
                      'legacy', 'migration', '遷移', '迁移', 'deprecated', '已失效']
    note: 'MCP Python SDK v1 API. v2.0.0 (2026-07-28) moved the low-level Server handlers to constructor params; teach MCPServer + @app.tool() instead'

  - pattern: 'pip install mcp(?![-"\w])'
    qualifier_terms: ['裸寫', '裸写', 'bare', '會裝到', '会装到', 'gets you', '⚠️',
                      'v1', '鎖版本', '锁版本', 'pin']
    note: 'Unpinned MCP SDK install — v2.0.0 is a breaking change, so teach pip install "mcp>=2,<3" (quoting the bare form inside a warning is fine and is what the qualifier terms allow)'

# Stale date-bound framing — 時間性過時用詞
# 注意：用 \s* 而不是字面 space、因為中文常寫 "2025年" 沒空格
stale_date_phrases:
  - pattern: '2025\s*(年|下半年)?\s*(才|新|剛).*?(發表|釋出|出|推出|公布)'
    note: '"newly released in 2025" framing (now historical in 2026)'

  - pattern: '2024\s*(剛|新|最新).*?(發表|釋出|推出)'
    note: '"newly released in 2024" framing (now historical in 2026)'

  - pattern: '剛發表|剛推出|剛釋出|新發表|甫推出'
    qualifier_terms: ['2026', '本月', '上月', '今年']
    note: 'Time-bound "newly released" without 2026 anchor'

# Files to skip entirely
exclude_files:
  - 'CHANGELOG.md'
  - 'CONTRIBUTORS.md'
  - 'archives/**'
  - '.ai/**'
  - 'book/**'

# Files where pre-2026 model refs are expected (don't warn)
exclude_files_pattern_specific:
  # Stage 6's reasoning lineage table is supposed to mention R1 as predecessor
  - file: 'stages/06-memory-rag.md'
    qualifier_window: 5  # widen qualifier search to ±5 lines for this file (default ±2)

# Context window — how many lines around a match to check for qualifier terms
qualifier_context_lines: 2
