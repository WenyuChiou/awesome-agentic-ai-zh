    note: 'The canonical Anthropic cookbook repository moved to anthropics/claude-cookbooks'

  - pattern: 'laude-institute/terminal-bench|princeton-nlp/SWE-agent|geekan/MetaGPT|hiyouga/LLaMA-Factory'
    include_files: ['stages/07-multi-agent-production.md']
    qualifier_terms: ['former', 'previous', 'historical', '舊', '旧', '歷史', '历史', 'redirect']
    note: 'Use the current canonical owners for Terminal-Bench, SWE-agent, MetaGPT, and LlamaFactory'

  - pattern: 'langchain-ai/langserve'
    include_files: ['stages/07-multi-agent-production.md']
    qualifier_terms: ['archived', 'historical', 'maintenance', '封存', '归档', '歷史', '历史', '維護', '维护']
    note: 'LangServe is archived and must not be presented as a current default deployment path'

  - pattern: 'Prompt caching.{0,80}(Anthropic-only|Anthropic only|僅 Anthropic|仅 Anthropic)|(?:90%|50-90%).{0,80}(prompt caching|Prompt caching)'
    include_files: ['stages/07-multi-agent-production.md']
    qualifier_terms: ['historical', 'history', '舊', '旧', '歷史', '历史']
    note: 'Prompt caching is not Anthropic-only, and savings must be measured rather than promised as a fixed percentage'

  - pattern: 'SOTA.{0,80}\d+(?:\.\d+)?%|\d+(?:\.\d+)?%.{0,80}SOTA'
    include_files: ['stages/07-multi-agent-production.md']
