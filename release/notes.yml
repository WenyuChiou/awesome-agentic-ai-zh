schema_version: 1
release_version: v2026.09.08

# One ordered list produces all three language sections in the GitHub Release.
# Links are shared so the three summaries cannot silently point to different pages.
changes:
  - id: deploy-pages-v5-0-1
    category: maintenance
    zh-TW: GitHub Pages 部署 Action 從 v5.0.0 更新至 v5.0.1，並繼續鎖定官方完整 commit SHA。新版為部署狀態輪詢加入 backoff 與 jitter，讓暫時性服務問題不會造成過密重試；教材內容與網址不變。
    zh-Hans: GitHub Pages 部署 Action 从 v5.0.0 更新至 v5.0.1，并继续锁定官方完整 commit SHA。新版为部署状态轮询加入 backoff 和 jitter，让临时服务问题不会造成过密重试；教材内容与网址不变。
    en: The GitHub Pages deployment Action moves from v5.0.0 to v5.0.1 while remaining pinned to the official full commit SHA. The update adds backoff and jitter to deployment polling so temporary service problems do not cause overly frequent retries; curriculum content and URLs are unchanged.
    links:
      - https://github.com/actions/deploy-pages/releases/tag/v5.0.1
