schema_version: 1
release_version: v2026.10.29-3
changes:
- id: rag-search-terms-and-comparisons
  category: reader-experience
  zh-TW: 進階 RAG 先解釋 BM25、向量搜尋與候選資料，再依症狀選方法。用同一批題目比較基線、混合搜尋與加重新排序，記錄 Recall@5、命中率、延遲與成本。保留 13 項方法、6 筆必讀及 12 筆評分資源，並修正手機核心詞排版與 GitHub 粗體。
  zh-Hans: 进阶 RAG 先解释 BM25、向量搜索与候选资料，再按症状选方法。用同一批题目比较基线、混合搜索与加重新排序，记录 Recall@5、命中率、延迟与成本。保留 13 项方法、6 条必读及 12 条评分资源，并修正手机核心术语排版与 GitHub 粗体。
  en: Advanced RAG explains BM25, vector search and candidates before choosing a method by symptom. Compare baseline, hybrid search and added
    reranking on the same questions, recording Recall@5, hit rate, latency and cost. All 13 methods, six required readings and 12 rated resources
    remain visible; mobile core-term layout and GitHub bold rendering are corrected.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/356
- id: execution-and-isolation-boundaries
  category: learning-safety
  zh-TW: Stage 5 將 MCP 限制限定於該 server，Stage 8 說明沙箱範圍取決於設定。Stage 6 每題先回專案根目錄完成安裝，再跑本機 Path A；雲端 Path B 為選用，先從各題說明確認供應商、金鑰與費用。
  zh-Hans: Stage 5 将 MCP 限制限定于该 server，Stage 8 说明沙箱范围取决于设置。Stage 6 每题先回项目根目录完成安装，再跑本机 Path A；云端 Path B 为选用，先从各题说明确认供应商、密钥与费用。
  en: Stage 5 scopes MCP limits to that server; Stage 8 explains that sandbox boundaries depend on configuration. For each Stage 6 exercise, return
    to the repository root and complete setup before running local Path A. Cloud Path B is optional; check the exercise guide for its provider,
    key setup and costs first.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/357
- id: model-terms-and-token-price-units
  category: learning-content
  zh-TW: Stage 1 在流程與圖示前解釋 Base Model、Instruct Model、模型權重及 Agent 零件，保留訓練方法並標明進階選修。A3 明定輸入與輸出單價皆按每百萬 token 計，兩項 token 數各除以一百萬，並提醒另查其他收費。
  zh-Hans: Stage 1 在流程与图示前解释 Base Model、Instruct Model、模型权重及 Agent 组件，保留训练方法并标明进阶选修。A3 明定输入与输出单价均按每百万 token 计，两项 token 数各除以一百万，并提醒另查其他收费。
  en: Stage 1 explains Base Model, Instruct Model, model weights and Agent components before the flow and diagram, retaining training methods
    and marking advanced electives. A3 declares both input and output rates per million tokens, divides each token count by one million, and notes
    that other charges must be checked separately.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/358
