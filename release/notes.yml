changes:
- id: qwen4-max-glm54
  category: model-reference
  zh-TW: Stage 1 更新 Qwen4-Max 的託管 API、1M token 上下文和區域價格。GLM-5.4 已提供給 Coding Plan 使用者，公開模型 API 仍待安全評估。保留 GLM-5.3 API 資料和本機練習。
  zh-Hans: Stage 1 更新 Qwen4-Max 的托管 API、1M token 上下文和地区价格。GLM-5.4 已提供给 Coding Plan 用户，公开模型 API 仍待安全评估。保留 GLM-5.3 API 资料和本地练习。
  en: Stage 1 updates the Qwen4-Max hosted API, 1M-token context, and regional pricing. GLM-5.4 is available to Coding Plan users, and the public model API is pending a security assessment. The GLM-5.3 API reference and local exercises stay in place.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/388
- id: catalog-safety-mirrors
  category: learning-safety
  zh-TW: 英文與簡中 MCP／Skills 目錄補齊 15 類原有的使用與安全提醒，讀者展開項目前就能看到。同步修正 GLM-4.5 的來源說明。
  zh-Hans: 英文与简中 MCP／Skills 目录补齐 15 类原有的使用与安全提醒，读者展开项目前就能看到。同步修正 GLM-4.5 的来源说明。
  en: The English and Simplified Chinese MCP and Skills catalogs add 15 existing usage and safety notes above the expandable entries. The GLM-4.5 source note also matches the Traditional Chinese catalog.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/387
- id: pagekin-embedding-migration
  category: learning-resources
  zh-TW: 進階 RAG 新增 Pagekin 的選讀案例。換 Embedding 模型時，讀者可以看懂怎麼保留舊索引和全文搜尋，等新索引通過檢查再切換。可直接閱讀設計紀錄。
  zh-Hans: 进阶 RAG 新增 Pagekin 的选读案例。换 Embedding 模型时，读者可以看懂怎么保留旧索引和全文搜索，等新索引通过检查再切换。可直接阅读设计记录。
  en: Advanced RAG adds an optional Pagekin reading case. It shows how to preserve the old index and full-text search while changing the Embedding model, then switch after checking the new index. The design record is available to read directly.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/389
