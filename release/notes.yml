changes:
- id: gemini-carbon-access-and-pricing
  category: model-information
  zh-TW: Stage 1 補上 Gemini Carbon 的受限開放狀態與官方價格條件，區分模型公告、指定夥伴存取與一般 API 可用。未知欄位明確標示，三語一致。
  zh-Hans: Stage 1 补上 Gemini Carbon 的受限开放状态与官方价格条件，区分模型公告、指定伙伴访问与一般 API 可用。未知字段明确标注，三语一致。
  en: Stage 1 adds Gemini Carbon access limits and official pricing conditions, distinguishing the announcement, selected-partner access
    and general API availability. Unknown fields are labeled explicitly in all three languages.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/349
- id: greptile-curriculum-review
  category: review-governance
  zh-TW: 三語 README 在支持與聯絡附近加入 Greptile 徽章。教材審查規則檢查三語意思、重要資訊展開、來源與手機／桌面排版證據；不自動批准或合併，最終判斷仍由維護者決定。
  zh-Hans: 三语 README 在支持与联系附近加入 Greptile 徽章。教材审查规则检查三语含义、重要信息展开、来源与手机／桌面排版证据；不自动批准或合并，最终判断仍由维护者决定。
  en: The three READMEs add a Greptile badge near support and contact. Curriculum review rules check matching meaning, visible important
    material, sources and mobile/desktop layout evidence. Reviews do not automatically approve or merge; the maintainer makes the final
    decision.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/350
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/351
- id: numbered-github-guides
  category: learning-content
  zh-TW: Stage 0 用七個短步驟說明改文件、Commit、Push、PR 與 Merge。使用本專案真實 Commit、PR 與 Issue 截圖，以紅框和編號指認欄位；三語各有標註版本。核心詞、主練習及 18 筆評分資源維持展開。
  zh-Hans: Stage 0 用七个短步骤说明改文档、Commit、Push、PR 与 Merge。使用本项目真实 Commit、PR 与 Issue 截图，以红框和编号指认字段；三语各有标注版本。核心术语、主练习及 18 条评分资源保持展开。
  en: Stage 0 uses seven short steps to explain document edits, Commit, Push, PR and Merge. Real project Commit, PR and Issue screenshots
    use red boxes and numbers, with a labeled version for each language. Core terms, the main exercise and 18 rated resources remain
    visible.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/353
- id: beginner-flow-and-advanced-routes
  category: reader-experience
  zh-TW: 修正十處閱讀卡點：統一 Capstone 入口、補齊環境與資料夾步驟，說明練習全對時怎麼繼續，並指明要展開哪張表。先解釋 Recall@k 與命中率，再使用指標；進階 RAG 按症狀選路，保留完整名詞。Subagent 教法提醒確認實際平行狀態，雲端遷移細節收合，但預算與安全提醒保持可見。
  zh-Hans: 修正十处阅读卡点：统一 Capstone 入口、补齐环境与文件夹步骤，说明练习全对时怎么继续，并指明要展开哪张表。先解释 Recall@k 与命中率，再使用指标；进阶 RAG 按症状选路，保留完整术语。Subagent 教法提醒确认实际并行状态，云端迁移细节折叠，但预算与安全提醒保持可见。
  en: 'Fixes ten reader-flow problems: align Capstone entry rules, fill in environment and folder steps, explain how to continue after
    all answers are correct, and identify which table to expand. Recall@k and hit rate are explained before use; advanced RAG routes
    start with symptoms and retain the full terminology. Subagent guidance asks readers to verify actual parallel execution. Cloud migration
    details are collapsed while budget and safety warnings remain visible.'
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/354
- id: permanent-notes-only-releases
  category: release-policy
  zh-TW: 今後正式 Release 只發布繁體中文、簡體中文與英文說明，不產生或附上 PDF。移除 PDF 開關、建置及上傳步驟，發布前後確認附件清單為空；內容與連結檢查、main SHA 鎖定及 Environment 批准照常保留。手動匯出工具獨立保留。
  zh-Hans: 今后正式 Release 只发布繁体中文、简体中文与英文说明，不生成或附加 PDF。移除 PDF 开关、构建及上传步骤，发布前后确认附件列表为空；内容与链接检查、main SHA 锁定及 Environment 批准照常保留。手动导出工具独立保留。
  en: Future releases publish Traditional Chinese, Simplified Chinese and English notes without generating or attaching PDFs. The PDF
    option, build and upload steps are removed; empty asset lists are verified before and after publishing. Content and link checks,
    the main SHA lock and Environment approval remain. Standalone manual export tools are retained.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/blob/main/.github/workflows/release.yml
