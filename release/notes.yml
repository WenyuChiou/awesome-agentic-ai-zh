schema_version: 1
release_version: v2026.11.21
changes:
- id: agent-safety-basics
  category: learning-safety
  zh-TW: 新增 Agent 安全入門。用同一個研究摘要案例練習工具權限、連接 MCP 或加入 Skill 前要問的事，以及核准和續跑。離線練習可核對拒絕 0 筆、核准 1 筆、重跑仍 1 筆。Stage 8 補充文件、搜尋結果和工具回傳內容也可能帶入提示注入。
  zh-Hans: 新增 Agent 安全入门。用同一个研究摘要案例练习工具权限、连接 MCP 或添加 Skill 前要问的事，以及批准和续跑。离线练习可核对拒绝 0 条、批准 1 条、重跑仍 1 条。Stage 8 补充文档、搜索结果和工具返回内容也可能带来提示注入。
  en: 'A new Agent safety guide uses one research-summary example to teach tool permissions, checks before connecting MCP or adding a Skill, and approval and resume. The offline exercise shows 0 entries on rejection, 1 on approval, and still 1 after retry. Stage 8 explains that documents, search results, and tool outputs can carry prompt injection.'
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/381
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/378
- id: stage-one-model-reference
  category: model-reference
  zh-TW: Stage 1 更新 Mistral Large 4 的開放權重、價格與授權，並更新 Claude Fable／Mythos 5.2 的型號、價格與使用條件。補上 GPT-6.2 Astra／Sol、Gemini 4 Hydrogen／Neon，以及 Carbon 的付費 API 與優惠期限。
  zh-Hans: Stage 1 更新 Mistral Large 4 的开放权重、价格与授权，并更新 Claude Fable／Mythos 5.2 的型号、价格与使用条件。补上 GPT-6.2 Astra／Sol、Gemini 4 Hydrogen／Neon，以及 Carbon 的付费 API 与优惠期限。
  en: Stage 1 updates open weights, pricing and licensing for Mistral Large 4, plus model IDs, pricing and access for Claude Fable and Mythos 5.2. It adds GPT-6.2 Astra and Sol, Gemini 4 Hydrogen and Neon, and details for Carbon's paid API and introductory pricing deadline.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/370
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/374
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/376
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/377
- id: qmd-and-playwright-cli
  category: learning-resources
  zh-TW: 進階 RAG 加入 QMD，用同一批本機筆記比較三種搜尋。A3 加入 Playwright CLI，用本機練習頁檢查按鈕行為。
  zh-Hans: 进阶 RAG 加入 QMD，用同一批本地笔记比较三种搜索。A3 加入 Playwright CLI，用本地练习页检查按钮行为。
  en: Advanced RAG adds QMD to compare three search modes on the same local notes. A3 adds Playwright CLI to check button behavior on a local practice page.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/379
- id: framework-reference-health
  category: reference-maintenance
  zh-TW: Microsoft Agent Framework 改連 Microsoft Learn。OpenShell 改連目前的官方 repo。AutoGen 的教材標示已封存，保留供查閱舊範例及準備遷移。Stage 1 的 LLM Leaderboard 改連新版網址。
  zh-Hans: Microsoft Agent Framework 改连 Microsoft Learn。OpenShell 改连当前的官方 repo。AutoGen 的教材标明已归档，保留供查阅旧示例及准备迁移。Stage 1 的 LLM Leaderboard 改连新版网址。
  en: Microsoft Agent Framework links now point to Microsoft Learn, and OpenShell links use its current repository. AutoGen is marked archived and remains a reference for existing examples and migration. Stage 1 follows LLM Leaderboard to its new address.
  links:
  - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/380
  - https://github.com/ai-openshell/openshell
  - https://github.com/microsoft/autogen
- id: docs-and-ci-dependencies
  category: maintenance
  zh-TW: 更新文件站的 Markdown、PyMdown Extensions 與 MkDocs Material，並調整 PR 檢查用的 requests 版本，讓文件建置和相依套件維持相容。
  zh-Hans: 更新文档站的 Markdown、PyMdown Extensions 与 MkDocs Material，并调整 PR 检查用的 requests 版本，让文档构建和依赖保持兼容。
  en: The docs site updates Markdown, PyMdown Extensions and MkDocs Material. PR checks update requests to keep the documentation build and its dependencies compatible.
