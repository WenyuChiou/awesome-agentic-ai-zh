changes:
  - id: gpt-terra-model-guidance
    category: learning-content
    zh-TW: Stage 1 三語加入 GPT-6.1 Terra 的 API 型號、國際價格、快取與長上下文計費條件，說明工具支援及使用限制。選模型的簡短入口保持展開；完整型號與價格留在收合詳表。
    zh-Hans: Stage 1 三语加入 GPT-6.1 Terra 的 API 型号、国际价格、缓存与长上下文计费条件，说明工具支持及使用限制。选模型的简短入口保持展开；完整型号与价格留在折叠详表。
    en: Stage 1 adds GPT-6.1 Terra API IDs, international pricing, caching and long-context billing conditions in all three languages, with tool support and usage limits. The short model-selection guide stays visible; full IDs and pricing remain in the expandable reference.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/341
  - id: kimi-pro-model-guidance
    category: learning-content
    zh-TW: Stage 1 三語更新 Kimi K3.1 Pro／Highspeed 的 API 型號、國際價格、快取及工具呼叫限制。區分 API 已可用與完整權重尚待公布，補上 K2 新帳號截止及預定退役資訊。只更新 GPT／Kimi 查核日期，保留 18 家模型與本機練習；未呼叫付費 API。
    zh-Hans: Stage 1 三语更新 Kimi K3.1 Pro／Highspeed 的 API 型号、国际价格、缓存及工具调用限制。区分 API 已可用与完整权重尚待公布，补上 K2 新账号截止及预定退役信息。只更新 GPT／Kimi 核查日期，保留 18 家模型与本地练习；未调用付费 API。
    en: Stage 1 refreshes Kimi K3.1 Pro/Highspeed API IDs, international pricing, caching and tool-calling limits in all three languages. It distinguishes available APIs from full weights that are still pending, and explains the K2 cutoff for new accounts and planned retirement. Only GPT/Kimi verification dates change; all 18 model families and local exercises remain. No paid API calls were made.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/341
  - id: python-action-maintenance
    category: maintenance
    zh-TW: GitHub Actions 的 actions/setup-python 由 7.0.0 更新至 7.1.0，固定完整 commit SHA。Python 版本、工作流程觸發條件與權限不變。本版只發布三語說明，不產生或附上 PDF。
    zh-Hans: GitHub Actions 的 actions/setup-python 从 7.0.0 更新至 7.1.0，固定完整 commit SHA。Python 版本、工作流程触发条件与权限不变。本版只发布三语说明，不生成或附加 PDF。
    en: GitHub Actions updates actions/setup-python from 7.0.0 to 7.1.0, pinned to a full commit SHA. Python versions, workflow triggers and permissions stay unchanged. This release publishes trilingual notes without generating or attaching PDFs.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/340
