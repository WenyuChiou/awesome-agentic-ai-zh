schema_version: 1
release_version: v2026.09.14

# One ordered list produces all three language sections in the GitHub Release.
# Links are shared so the three summaries cannot silently point to different pages.
changes:
  - id: simplify-readme-banner-entry
    category: reader-ux
    zh-TW: 三語 README 移除動畫 banner 下方重複的靜態圖與文件站捷徑，讓首頁入口更乾淨。動畫停止時仍保留完整構圖；文件站的減少動態、無 JavaScript 靜態 PNG 與三語 PDF fallback 都繼續保留。
    zh-Hans: 三语 README 移除动画 banner 下方重复的静态图与文档站快捷入口，让首页入口更干净。动画停止时仍保留完整构图；文档站的减少动态、无 JavaScript 静态 PNG 与三语 PDF fallback 都继续保留。
    en: The three READMEs remove the duplicate static-image and documentation-site shortcuts below the animated banner for a cleaner entry point. The complete composition remains visible when animation stops, while reduced-motion, no-JavaScript PNG, and trilingual PDF fallbacks remain available.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/265
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/266
  - id: fix-rendered-markdown-emphasis
    category: maintenance
    zh-TW: 修正 Stage 6 五組範例的三語收合區塊，以及 CLI 工具表與 Stage 3 摘要中的行內程式碼：粗體、清單、行內程式碼與連結現在會由 MkDocs 正確解析，不再把 `**Context**` 或反引號這類 Markdown 記號直接顯示給讀者。新增 post-build gate，會檢查實際 HTML，而不是只看 `.md` 原始碼；程式碼範例中的記號仍被允許。
    zh-Hans: 修正 Stage 6 五组示例的三语折叠区块，以及 CLI 工具表和 Stage 3 摘要中的行内代码：粗体、列表、行内代码与链接现在会由 MkDocs 正确解析，不再把 `**Context**` 或反引号这类 Markdown 标记直接显示给读者。新增 post-build gate，会检查实际 HTML，而不是只看 `.md` 源码；代码示例中的标记仍被允许。
    en: Fixed the trilingual collapsible sections in five Stage 6 examples, plus inline code in the CLI tool table and Stage 3 summaries. MkDocs now renders emphasis, lists, inline code, and links instead of showing Markdown markers such as `**Context**` or backticks to readers. A new post-build gate checks the actual HTML rather than source `.md` alone, while still allowing markers inside code examples.
    links:
      - https://wenyuchiou.github.io/awesome-agentic-ai-zh/examples/stage-6/01-embeddings/
  - id: stage7-production-foundations
    category: learning-content
    zh-TW: Stage 7 改為「Agent 上線工程：可測、可看、可停、可恢復」。同一個查資料案例依序解釋 Harness、Loop、Graph、Eval、Observability、Approval、Checkpoint、Resume 與 Recovery；完整 Eval Case 明確包含 input、初始狀態、成功條件、禁止行為、選用參考答案、評分方法與案例資訊，避免把 Golden Set 誤解成只有輸入。
    zh-Hans: Stage 7 改为“Agent 上线工程：可测、可看、可停、可恢复”。同一个资料查询案例依次解释 Harness、Loop、Graph、Eval、Observability、Approval、Checkpoint、Resume 与 Recovery；完整 Eval Case 明确包含 input、初始状态、成功条件、禁止行为、可选参考答案、评分方法与案例信息，避免把 Golden Set 误解为只有输入。
    en: >-
      Stage 7 is now “Production Engineering for Agents: Testable, Observable, Stoppable, and Recoverable.” One research-assistant example progressively explains Harness, Loop, Graph, Eval, Observability, Approval, Checkpoint, Resume, and Recovery. A complete Eval Case explicitly includes input, initial state, success criteria, forbidden actions, an optional reference answer, grading method, and case metadata, so a Golden Set is not mistaken for inputs alone.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/267
  - id: stage75-evidence-led-advanced-choices
    category: learning-content
    zh-TW: Stage 7.5 改成「有證據才增加複雜度」的進階選讀，不再重教 Stage 7 基礎。可見核心詞表先用白話說明 Evaluator–Optimizer／Agent-as-Judge、Failure Injection／Chaos Eval、Autonomy Gradients／Trust Layers 與 Model–Harness Fit，再用兩組三語亮色圖協助讀者依失敗證據選擇最小做法。
    zh-Hans: Stage 7.5 改成“有证据才增加复杂度”的进阶选读，不再重复讲解 Stage 7 基础。可见核心词表先用白话说明 Evaluator–Optimizer／Agent-as-Judge、Failure Injection／Chaos Eval、Autonomy Gradients／Trust Layers 与 Model–Harness Fit，再用两组三语亮色图帮助读者根据失败证据选择最小做法。
    en: Stage 7.5 is now an advanced reading map that adds complexity only when evidence justifies it, without reteaching Stage 7 foundations. Its visible core-term table explains Evaluator–Optimizer/Agent-as-Judge, Failure Injection/Chaos Eval, Autonomy Gradients/Trust Layers, and Model–Harness Fit in plain language, followed by two matching trilingual diagrams that help readers choose the smallest response to observed failures.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/268
