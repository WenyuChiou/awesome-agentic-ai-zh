schema_version: 1
release_version: v2026.09.13

# One ordered list produces all three language sections in the GitHub Release.
# Links are shared so the three summaries cannot silently point to different pages.
changes:
  - id: remove-unavailable-yield-mcp
    category: maintenance
    zh-TW: 發布前完整連結掃描確認 YIELD INTELLIGENCE 的 hosted MCP、替代路徑與 pricing 入口都回傳 404。三語精選目錄已移除這筆目前無法使用的服務與 repository snapshot，不以 README 仍寫著「live」取代實際端點證據。
    zh-Hans: 发布前完整链接扫描确认 YIELD INTELLIGENCE 的 hosted MCP、替代路径与 pricing 入口都返回 404。三语精选目录已移除这项目前无法使用的服务与 repository snapshot，不以 README 仍写着“live”取代实际端点证据。
    en: The full pre-release link scan confirmed that YIELD INTELLIGENCE's hosted MCP endpoint, alternate route, and pricing endpoint all return 404. The unavailable service and its repository snapshot were removed from all three curated catalogs; a README that still says “live” does not outweigh direct endpoint evidence.
    links:
      - https://github.com/thebrierfox/intuitek-ace
  - id: role-map-icon-motion
    category: reader-ux
    zh-TW: 首頁下方的角色分流圖加入圖示動畫試版：只讓五個代表性角色圖示依序輕動，並支援停止／播放、減少動態與靜態 PNG。這組圖沿用三張舊原圖，因此圖中文字尚未完全對齊；英文圖的 Analysts 也比正文的 Knowledge workers 範圍窄。正式校正前，請以圖片下方保持展開的角色表為準。
    zh-Hans: 首页下方的角色分流图加入图标动画试版：只让五个代表性角色图标依次轻动，并支持停止／播放、减少动态与静态 PNG。这组图沿用三张旧原图，因此图中文字尚未完全对齐；英文图的 Analysts 也比正文的 Knowledge workers 范围窄。正式校正前，请以图片下方保持展开的角色表为准。
    en: The role map below the homepage now has a pilot icon animation. Only the five representative role icons move in sequence, with stop/play controls, reduced-motion support, and static PNGs. Because it reuses three older source images, wording inside the images is not yet fully aligned; the English image's “Analysts” label is also narrower than “Knowledge workers” in the text. Until the artwork is corrected, use the always-visible role table below it as the canonical guide.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/259
  - id: trilingual-contribution-contract
    category: governance
    zh-TW: 貢獻規則改成繁中先定稿、英文與簡中在同一個 PR 同步。三語的概念、URL、數字、評分與安全限制必須一致；新增資源不再以會變動的 GitHub stars 當門檻，改用來源、維護狀態與教學價值判斷。
    zh-Hans: 贡献规则改为繁中先定稿、英文与简中在同一个 PR 同步。三语的概念、URL、数字、评分与安全限制必须一致；新增资源不再以会变动的 GitHub stars 作为门槛，而是根据来源、维护状态与教学价值判断。
    en: Contribution rules now finalize Traditional Chinese first and synchronize English and Simplified Chinese in the same PR. Concepts, URLs, numbers, ratings, and safety limits must match across locales; new resources are judged by sources, maintenance, and teaching value instead of changing GitHub star counts.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/260
  - id: eval-evidence-foundations
    category: learning-content
    zh-TW: Stage 7 新增可見的 Eval 基礎：Golden Set、Reference Set、Trial、Grader、Baseline、Regression 與 Holdout Set 都先用白話解釋，再保留正式名稱。三語同版圖把「定義成功、建立案例、重複測試、比較基準、人工複查」串成一個證據迴圈。
    zh-Hans: Stage 7 新增可见的 Eval 基础：Golden Set、Reference Set、Trial、Grader、Baseline、Regression 与 Holdout Set 都先用白话解释，再保留正式名称。三语同版图把“定义成功、建立案例、重复测试、比较基准、人工复查”串成一个证据循环。
    en: Stage 7 now teaches visible Eval foundations. Golden Set, Reference Set, Trial, Grader, Baseline, Regression, and Holdout Set are explained in plain language before retaining their formal names. A matching diagram in all three locales connects success criteria, cases, repeated trials, baseline comparison, and human review into one evidence loop.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/261
  - id: runnable-eval-evidence
    category: examples
    zh-TW: Stage 7 的 Eval 範例改用 8 題版本化 JSON，分成 5 題開發案例與 3 題凍結 holdout。Ollama 與 Anthropic 共用同一個 runner，可選多次 trial、保存報告並和 baseline 比較；資料格式不相容或空輸出會直接失敗，離線測試不讀 API key。
    zh-Hans: Stage 7 的 Eval 范例改用 8 题版本化 JSON，分为 5 题开发案例与 3 题冻结 holdout。Ollama 与 Anthropic 共用同一个 runner，可选择多次 trial、保存报告并与 baseline 比较；数据格式不兼容或空输出会直接失败，离线测试不读取 API key。
    en: >-
      The Stage 7 Eval example now uses eight versioned JSON cases: five development cases and three frozen holdouts. Ollama and Anthropic share one runner with optional repeated trials, saved reports, and baseline comparison; incompatible data or empty output fails explicitly, and offline tests never read API keys.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/262
