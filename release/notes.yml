schema_version: 1
release_version: v2026.10.29

# One ordered list produces all three language sections.
# Only changes landed after v2026.10.26 belong here.
changes:
  - id: verified-course-and-leaderboard-links
    category: maintenance
    zh-TW: 複查上版 11 個無法驗證的連結，區分可讀頁面、登入入口與反爬蟲阻擋，未發現確定失效。三語改用 Arena 現行路徑及 DeepLearning.AI 課程 canonical URL；不把受阻連結改列成功，也不放寬掃描基線。
    zh-Hans: 复查上版 11 个无法验证的链接，区分可读页面、登录入口与反爬虫阻挡，未发现确定失效。三语改用 Arena 当前路径及 DeepLearning.AI 课程 canonical URL；不把受阻链接改列成功，也不放宽扫描基线。
    en: Rechecks the previous release's 11 unverified links, distinguishing readable pages, sign-in pages and anti-bot blocks; none was confirmed broken. All three languages use current Arena paths and canonical DeepLearning.AI course URLs. Blocked links are not relabeled as verified, and scan baselines are not relaxed.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/343
  - id: mobile-course-picker
    category: reader-experience
    zh-TW: 三語課程選路表在手機逐項使用完整寬度，英文按完整單字換行；桌面保留三欄比較。保留所有選路、課程入口、13 筆精選課程、原有星等、費用限制與查核日期，重要資訊維持展開。
    zh-Hans: 三语课程选路表在手机逐项使用完整宽度，英文按完整单词换行；桌面保留三栏比较。保留所有选路、课程入口、13 笔精选课程、原有星级、费用限制与核查日期，重要信息保持展开。
    en: The trilingual course picker uses full-width entries on phones and wraps English at whole-word boundaries; desktop keeps a three-column comparison. All routes, course entrances, 13 curated courses, ratings, cost limits and verification dates remain, with important information visible.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/344
  - id: stage-zero-github-foundations
    category: learning-content
    zh-TW: Stage 0 學習目標後新增可見核心詞表，白話區分 Python、Terminal、CLI、Shell、資料格式與 GitHub，以及 Commit、Push、PR、Merge。三語圖解和本專案真實 Commit 截圖說明作者、時間、訊息、SHA、History 與 Diff，並區分 Commit 和 Push 時間。保留整合練習及 18 筆評分資源。
    zh-Hans: Stage 0 学习目标后新增可见核心词表，白话区分 Python、Terminal、CLI、Shell、数据格式与 GitHub，以及 Commit、Push、PR、Merge。三语图解和本项目真实 Commit 截图说明作者、时间、消息、SHA、History 与 Diff，并区分 Commit 和 Push 时间。保留综合练习及 18 笔评分资源。
    en: Stage 0 adds a visible glossary after its learning goals, explaining Python, Terminal, CLI, Shell, data formats, GitHub, Commit, Push, PR and Merge in plain language. Trilingual diagrams and a real project commit screenshot explain author, date, message, SHA, History and Diff, distinguishing commit time from push time. The integrated exercise and 18 rated resources remain.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/346
  - id: readable-tables-and-bold
    category: reader-experience
    zh-TW: 三語資源表置中、說明靠左、同類分類合併，repo 只顯示專案名稱。主頁與角色入口留足名稱欄，文件站手機及平板逐項閱讀，桌面保留多欄比較。全站 Markdown 掃描後修正粗體星號外露；章名、來源、星等、限制與重要資訊維持可見。
    zh-Hans: 三语资源表居中、说明靠左、同类分类合并，repo 只显示项目名称。主页与角色入口留足名称栏，文档站手机及平板逐项阅读，桌面保留多栏比较。全站 Markdown 扫描后修正粗体星号外露；章节名、来源、星级、限制与重要信息保持可见。
    en: Trilingual resource tables are centered, explanatory text is left-aligned, matching categories are merged, and repository labels show project names. Homepage and role-entry tables give names enough space; the docs site stacks entries on phones and tablets while preserving desktop comparisons. A repository-wide Markdown scan fixes exposed bold markers. Full chapter names, sources, ratings, limits and important information remain visible.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/pull/347
  - id: readme-cleanup-and-star-history
    category: reader-experience
    zh-TW: 三語 README 移除角色圖旁獨立的「靜態圖」連結及重複的 starter.py 操作段落，保留角色圖、文件站停止動畫功能與完整使用指南。在 README 最下方恢復可點擊的 Star History 曲線圖與動態全球排名徽章。本版只發布三語說明，不產生或附上 PDF。
    zh-Hans: 三语 README 移除角色图旁独立的「静态图」链接及重复的 starter.py 操作段落，保留角色图、文档站停止动画功能与完整使用指南。在 README 最下方恢复可点击的 Star History 曲线图与动态全球排名徽章。本版只发布三语说明，不生成或附加 PDF。
    en: The three READMEs remove the standalone static-image link beside the role diagram and the repeated starter.py instructions, keeping the role diagram, docs-site pause control and full usage guide. A clickable Star History chart and dynamic global-rank badge return at the bottom of each README. This release publishes trilingual notes without generating or attaching PDFs.
    links:
      - https://github.com/WenyuChiou/awesome-agentic-ai-zh/blob/main/README.md
