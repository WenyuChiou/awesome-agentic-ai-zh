name: Repository freshness

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-repository-freshness.py'
      - 'scripts/repository_freshness.py'
      - 'scripts/repository-freshness-snapshot.json'
      - '.github/workflows/repository-freshness.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: repository-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-links:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check repository facts on changed Markdown lines
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/test_repository_freshness.py
          python3 scripts/check-repository-freshness.py changed \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  full-inventory:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan every unique repository once
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check-repository-freshness.py full \
            --workers 4 \
            --output-snapshot /tmp/repository-freshness-snapshot.json \
            --report /tmp/repository-freshness-report.md \
            --json-report /tmp/repository-freshness-report.json
          code=$?
          if [ ! -f /tmp/repository-freshness-report.md ]; then
            printf '# Repository freshness report\n\nThe scan stopped before it could produce a report. Treat this run as unverified.\n' \
              > /tmp/repository-freshness-report.md
          fi
          if [ ! -f /tmp/repository-freshness-report.json ]; then
            printf '{"state":"unverified","error":"scan did not produce a JSON report"}\n' \
              > /tmp/repository-freshness-report.json
          fi
          if [ ! -f /tmp/repository-freshness-snapshot.json ]; then
            printf '{"schema_version":1,"state":"unverified","error":"scan did not produce an inventory"}\n' \
              > /tmp/repository-freshness-snapshot.json
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-freshness-${{ github.run_id }}
          path: |
            /tmp/repository-freshness-snapshot.json
            /tmp/repository-freshness-report.md
            /tmp/repository-freshness-report.json
          if-no-files-found: error
      - name: Open, update, or close the single tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          title='[automation] Repository freshness needs review'
          number=$(gh issue list --repo "$REPO" --state open \
            --search "in:title $title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$EXIT_CODE" != '0' ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$REPO" --body-file /tmp/repository-freshness-report.md
            else
              gh issue create --repo "$REPO" --title "$title" \
                --body-file /tmp/repository-freshness-report.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body 'The latest full scan found no hard repository-fact failures. Closing this tracking issue.'
            gh issue close "$number" --repo "$REPO"
          fi
      - name: Fail after preserving the report
        if: always() && steps.scan.outputs.exit_code != '0'
        run: exit 1
