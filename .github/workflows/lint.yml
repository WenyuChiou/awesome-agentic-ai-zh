name: Lint (link rot + banned words + schema)

on:
  # 刻意「不」加 paths 過濾。這是 blocking gate，將來可能被設成 required status check；
  # 而 GitHub 對「required 但從未回報」的 check 是無限期等待，PR 會永遠卡在
  # 「Expected — Waiting for status to be reported」。paths 過濾會讓整個 workflow 不觸發、
  # 連 check 物件都不產生，正是那個死鎖。
  # （job 層的 `if:` 不一樣——被 skip 的 job 仍然會回報一個 skipped 的 check，GitHub 視為
  # 通過，所以本檔的 link-rot / star-drift 那種 guard 是安全的，不必動。）
  # 這個 filter 原本讓 130 / 473 個 tracked 檔案觸發不了任何一次執行（examples/ 114、
  # .github/ 9、root 6、docs/ 1）。它也會跳過只動 CITATION.cff 的 chore(release) commit
  # ——全部 12 個 release commit 裡有 9 個是這種；另外 3 個只是因為同時改了 CHANGELOG.md
  # 才僥倖觸發，不是設計。
  # 整份 workflow 只要數十秒，省下的 CI 時間遠不值得這個風險。
  pull_request:
  # 也在 push 到 main 時跑。這個 repo 的小改動常常直接進 main（維護者自己推），
  # 那條路徑以前完全不經過這個 workflow，所以 blocking gate 等於沒跑。
  # 2026-08-03 的實例：一個 overclaim 片語在 main 上紅了約 15 小時沒人發現
  #（47c9682 07:06 EDT 引入 → c0f2bbe 22:07 EDT 修掉），而且不是我們自己抓到的，
  # 是靠一個外部 PR 照出來的——因為 GitHub 的 PR 檢查跑的是「合併後」的結果，不是分支本身。
  # link-rot / star-drift 兩個 job 有 `if: schedule || workflow_dispatch` 的 guard，
  # 不會被 push 觸發，所以 push 跑的是 banned-words + freshness-tests
  #（實測 17s + 9s）+ anchor-slug-parity。最後那個是這份檔案裡第一個要裝
  # 非 stdlib 依賴的 job（`requirements-docs.txt`，因為它需要真正的 mkdocs
  # config loader 才能問出網站實際會用哪個 slugify），所以會比另外兩個久一些。
  push:
    branches: [main]
  schedule:
    # 每月 1 號 UTC 03:00 跑完整檢查（catch link rot + star drift）
    - cron: '0 3 1 * *'
  workflow_dispatch:

# 這個 workflow 只讀 repo、不寫回任何東西。pull_request 事件下 GitHub 對 fork 一律
# 發唯讀 token，但 push 事件的權限來自 repo 設定，未來被改掉就會靜默放寬，所以明寫。
# 跟 anchor-validator / stage-template-check / freshness-2026 一致。
permissions:
  contents: read

jobs:
  banned-words:
    name: Banned-word audit (zh-Hans slips + overclaim phrases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check zh-Hans slips in zh-TW canonical files
        run: |
          # 只掃 zh-TW canonical 檔。
          #   - --exclude="*.en.md"     skip 英文 companion
          #   - --exclude="*.zh-Hans.md"  skip 簡中 companion（裡面合法包含這些詞）
          #   resources/style-guide.md 跟 .github/ 是 policy doc，必然包含禁用詞做為
          #   「不要這樣寫」的範例，所以這個 step 也不掃 resources/。
          BANNED=("教程" "視頻" "軟件" "代碼" "用戶" "網絡" "默認" "函数" "演算法" "算法" "程序")
          FOUND=0
          for word in "${BANNED[@]}"; do
            if grep -rn --include="*.md" --exclude="*.en.md" --exclude="*.zh-Hans.md" \
                  -F "$word" stages branches walkthroughs README.md CONTRIBUTING.md CONTRIBUTORS.md 2>/dev/null \
                  | grep -v "(zh-Hans)" \
                  | grep -v "zh-Hans repo" \
                  | grep -v "中文（zh-Hans）"; then
              echo "❌ Banned word found: $word"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo ""
            echo "Found $FOUND banned-word violations. See resources/style-guide.md §3."
            exit 1
          fi
          echo "✓ No banned words detected."

      - name: Check zh-TW residue in zh-Hans files (warning only)
        run: |
          # 反向檢查：zh-Hans 檔混入 zh-TW 用詞代表翻譯沒翻完。
          # `_build/` 是本機 mkdocs 產物（.gitignore 第 15 行），內容是 docs/ 的
          # 副本。CI 全新 checkout 沒有它，所以這行對 CI 是 no-op；但本機跑同一段
          # 指令時它會把每個命中重複計一次，而且那份副本可能是修正前的舊建置——
          # 2026-08-14 實測，同一段指令在本機吐出的命中數約是 tracked 檔案的三倍多
          # （確切數字無法重現：`_build/` 不進版控，所以那次測量沒有人能重跑）。
          # 一個「本機與 CI 不同調」的檢查，會讓人不信任正確的那一邊。
          # **僅 warning 模式**——不擋 PR、不要求完美。zh-Hans 翻譯是漸進的，
          # 殘留是常態；這個 check 只是提示哪幾個詞還可以順手修。
          # 不掃：style-guide / glossary（會引用對照詞當例子）、.ai/、book/。
          # 「影片」刻意不在這張表裡：它現在由 blocking gate
          # (zh-hans-localize.py 的 GUARDED_VOCAB) 負責,而且那條規則帶守衛——
          # 「投影片」是合法的、不該被改。這裡是 `grep -F`,沒有守衛的概念,
          # 留著只會對唯一一個正確的「投影片」永遠開火。
          # **一個永遠在叫的假警報,跟沒有警報一樣糟**,而且它剛好會削弱這次
          # 修好的那條規則的可信度。
          BANNED_TW=("使用者" "軟體" "硬體" "資訊" "品質" "資料" "專案" "腳本" "預設" "演算法" "應用程式" "網路" "連結" "服務" "範例" "範本" "設定" "註解" "終端機" "命令列" "編輯器" "瀏覽器" "客戶端" "伺服器" "倉儲" "必修閱讀" "飛書")
          FOUND=0
          for word in "${BANNED_TW[@]}"; do
            if grep -rn --include="*.zh-Hans.md" \
                  -F "$word" . 2>/dev/null \
                  | grep -v "^./resources/style-guide.zh-Hans.md" \
                  | grep -v "^./resources/glossary.zh-Hans.md" \
                  | grep -v "^./.ai/" \
                  | grep -v "^./_build/" \
                  | grep -v "^./book/"; then
              echo "::warning::zh-TW word found in zh-Hans file: $word"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "Note: $FOUND zh-TW residue word(s) detected in .zh-Hans.md. See .ai/zh-Hans_glossary.md. Not blocking the PR — fix when convenient."
          else
            echo "✓ No zh-TW residue."
          fi

      - name: Check overclaim phrases (strict — blocking)
        run: |
          # 掃公開展示的內容檔（zh + en + zh-Hans）找 style-guide §3 列為禁用的 overclaim 用語。
          # 範圍涵蓋 stages/ branches/ walkthroughs/ tracks/ examples/ resources/（含
          # mcp-skills-catalog / cookbook / cli-agents-guide 等實際被讀者讀到的文件）+ 各
          # top-level 文件。
          #
          # 路徑 hygiene：
          #   - `.github/` 整個資料夾不在掃描 paths（內含 outreach drafts 跟「Don't say...」
          #     明示禁用清單，本來就會引用禁用詞、不該被掃）。
          #   - `resources/style-guide.md` + `resources/glossary.md` 透過 grep -v 後過濾
          #     （它們在 resources/ 下、必然被 recurse 到，且為了當 policy 例子會列禁用詞）。
          #
          # 用 `grep -Fi`（fixed string + case-insensitive）—— 2026-05-26 incident：上一輪
          # sweep 用 -F 是 case-sensitive、漏掉 examples/ 內 H2 標題的 `Production-grade`
          # 大寫變體 5 處。這次升級為 -Fi。
          #
          # Warn-only step history：原本有第二個 step 掃 `最完整的` 之類的灰色地帶用語、
          # 用 ::warning:: 不擋 PR。實測 corpus 有 30+ hit（多半是稱讚 Datawhale Hello-Agents
          # 之類他人專案的 citation framing、非 self-promo overclaim），噪音大於價值、移除。
          # 如未來要為其他灰色詞加 warn 機制，pattern 可參考 git log 找 2026-05-26 此 step
          # 的初版實作（drafted but removed pre-merge）。
          OVERCLAIMS=(
            # === existing canonical bans ===
            "the most canonical"
            "全世界最好的"
            "業界最強"
            "最緊迫"
            # === style-guide §3 expansions (2026-05-26, P3-G from audit) ===
            "首選"            # zh-TW "top choice"
            "首选"            # zh-Hans variant
            "唯一選擇"        # zh-TW "only choice"
            "唯一选择"        # zh-Hans
            "業界最佳"        # zh-TW "industry best" (sibling of 業界最強)
            "业界最佳"        # zh-Hans
            # === audit P3-G English overclaim (case-insensitive matches all variants) ===
            "production-grade"   # supersedes the older exact "Production-grade Chinese tutorial"
            "world-class"
            "best-in-class"
            "cutting-edge"
            "state-of-the-art"
            "industry-leading"
          )
          FOUND=0
          for phrase in "${OVERCLAIMS[@]}"; do
            hits=$(grep -rIn --include="*.md" -Fi "$phrase" \
                  stages branches walkthroughs tracks examples resources \
                  README.md README.en.md README.zh-Hans.md \
                  CONTRIBUTING.md CONTRIBUTING.en.md CONTRIBUTING.zh-Hans.md \
                  CONTRIBUTORS.md \
                  ROADMAP.md ROADMAP.en.md ROADMAP.zh-Hans.md \
                  CAPSTONE.md CAPSTONE.en.md CAPSTONE.zh-Hans.md \
                  PROGRESS.md PROGRESS.en.md PROGRESS.zh-Hans.md \
                  RESOURCES.md RESOURCES.en.md RESOURCES.zh-Hans.md \
                  2>/dev/null \
                  | grep -v "^resources/style-guide" \
                  | grep -v "^resources/glossary" \
                  || true)
            if [ -n "$hits" ]; then
              echo "❌ Overclaim phrase found: $phrase"
              echo "$hits"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo ""
            echo "Found $FOUND overclaim category/categories. See resources/style-guide.md §3 'Overclaim 用語禁用'."
            exit 1
          fi
          echo "✓ No overclaim phrases detected."

      - name: Check zh-Hans mainland localization (blocking)
        run: |
          # Blocking gate: zh-Hans mirrors must stay mainland-localized.
          # Catches future tw2s-only mirror syncs / hand edits that
          # reintroduce Taiwan vocab (呼叫/程式/品质…) or 「」 quotes.
          # stdlib-only script; ubuntu-latest ships python3 (no pip deps).
          python3 scripts/zh-hans-localize.py --check

      - name: Install opencc (for the Traditional-residue check)
        # The only pip dep in this job. zh-hans-localize.py stays stdlib-only;
        # this is for check-hans-chars.py, which asserts the real invariant
        # (converting a zh-Hans file with opencc t2s must be a no-op) instead of
        # approximating it with a hand-written character list.
        run: pip install opencc-python-reimplemented

      - name: Check for Traditional-character residue in zh-Hans (blocking)
        run: |
          # Blocking gate. zh-hans-localize.py checks Taiwan VOCABULARY and quote
          # style only — character-level 繁→簡 was assumed to have happened
          # upstream when the mirror was made with opencc. That left a permanent
          # hole: a character never converted in the first place was invisible to
          # every gate here. In 2026-08 it was holding 13 real residues, including
          # 動手練習 sitting mid-sentence in README.zh-Hans.md.
          # --require-opencc so a missing dependency fails loudly instead of
          # turning this into a silent no-op.
          python3 scripts/check-hans-chars.py --require-opencc

      - name: check-hans-chars.py detection unit tests
        # Pins the tw2s trap (tw2s maps 么->幺, mangling correct Simplified 什么
        # into ~880 false positives — the checker must use t2s) and every
        # exemption: code fences, link targets whose anchors point at zh-TW
        # headings, the 繁體中文 proper name, and the uniform shields.io badge row.
        # --require-opencc: fail rather than skip if the dep is missing, so this
        # step can never exit green having run zero tests.
        run: python3 scripts/test_hans_chars.py --require-opencc

      - name: Check no mirror lost content vs the canonical (blocking, ratchet)
        run: |
          # Blocking gate, and the systemic one. The recurring failure in this repo
          # is not a bad translation but a MISSING one — in a single 2026-08 sweep
          # that class turned up five times (the catalog's composition section, the
          # A2/A3 entry conditions, five expected-output blocks in stages/01, an
          # entire free-local exercise path, and 202 blockquote lines across 21
          # example READMEs). No other gate could see any of it: they all check that
          # what IS there is correct, never that anything is missing.
          # This is a RATCHET against scripts/mirror-parity-baseline.json — real
          # legitimate deltas are baselined, and it fails only when a deficit grows
          # or appears somewhere new. Deficits can therefore only shrink.
          python3 scripts/check-mirror-parity.py

      - name: check-mirror-parity.py detection unit tests
        # Pins the ratchet in BOTH directions: a growing gap must fail, a shrinking
        # one must pass without regenerating the baseline, and a mirror with MORE
        # content than the canonical is not a deficit.
        run: python3 scripts/test_mirror_parity.py

      - name: Check mirror pages embed their own locale's image (blocking)
        run: |
          # Blocking gate. check-locale-links.py only matches link targets ending
          # in .md, so image paths were invisible to every gate — 9 mismatches
          # were shipping, English and Simplified pages embedding Traditional-only
          # diagrams under localized alt text. Fails on a mismatch whose correct
          # sibling already exists (a one-line fix) or a dead reference; the 9
          # assets that genuinely do not exist yet are listed in KNOWN_MISSING so
          # a NEW mismatch fails instead of quietly joining the pile.
          python3 scripts/check-image-locale.py

      - name: check-image-locale.py detection unit tests
        run: python3 scripts/test_image_locale.py

      - name: Check MCP catalog counts are consistent (blocking)
        run: |
          # Blocking gate: the catalog's Index per-section counts and the
          # "NN+ MCP servers" headline repeated across README / RESOURCES /
          # branches / stages / tracks must all match the file's real entry
          # count. In 2026-08 the Index summed to 73 while the file held 76,
          # and 39 places still advertised a long-stale number — and two
          # separate hand-counts got it wrong in different ways, which is why
          # the number is now computed from the file instead of tallied by hand.
          python3 scripts/check-catalog-counts.py

      - name: check-catalog-counts.py detection unit tests
        # Pins BOTH incident classes: the entry-counting rule (an entry whose
        # heading has no bracket link must still count) and the claim coverage
        # (the first version of the checker validated only 17 of 36 real claims
        # because its regex demanded a fixed keyword right after the number).
        run: python3 scripts/test_catalog_counts.py

      - name: Check mirror pages link to their own locale (blocking)
        run: |
          # Blocking gate: an .en.md / .zh-Hans.md page must not link to the
          # zh-TW canonical when a same-locale sibling exists — that silently
          # drops non-Traditional readers onto a page they may not read.
          # 2026-08 sweep fixed 111 such links across 37 files; nothing else in
          # CI catches this (check-anchors only proves targets resolve, and
          # sync-language-switchers only manages the switcher row).
          # Fix with: python scripts/check-locale-links.py --apply
          python3 scripts/check-locale-links.py

      - name: check-locale-links.py detection unit tests
        # Pins the conservative exemptions (missing sibling / switcher row /
        # fenced code / external URL) so a future tweak can't start rewriting
        # links into dead ends. stdlib-only.
        run: python3 scripts/test_locale_links.py

      - name: Repo-walker exclude-path regression tests
        # The 2026-08-02 "silent false all-clear" class: eight gates matched
        # EXCLUDE_DIRS against the ABSOLUTE path, so a checkout under
        # `.claude/worktrees/<name>/` (this repo's standard worktree location)
        # skipped every file and still printed its success line.
        # check-catalog-counts.py was live — 0 of 248 files scanned, exit 0,
        # as a BLOCKING gate. CI never saw it: the runner path has no excluded
        # component, so the gates only went blind locally, which is the one
        # place they run pre-commit.
        # Includes a source-level scan that fails if any script reintroduces
        # the pattern, so this cannot come back a ninth time. stdlib-only.
        run: python3 scripts/test_repo_scan_excludes.py

      - name: refresh-stars.py detection unit tests
        # Pins the 2026-07 star-line write-back + neighbour-leak fix
        # (scripts/test_refresh_stars.py). stdlib-only; runs on every PR.
        run: python3 scripts/test_refresh_stars.py

      - name: pr-link-audit.py detection unit tests
        # Pins the PR link-audit bot's diff-parsing + advisory-flag logic
        # (scripts/test_pr_link_audit.py). stdlib-only, network-free.
        run: python3 scripts/test_pr_link_audit.py

      - name: check-links.py classification unit tests
        # Pins issue #94: the checker reported 14 failures of which 5 were real.
        # It identified itself in the UA (hosts refuse that), trusted HEAD (widely
        # mis-implemented), and filed 401/403/429 refusals as dead links. A gate
        # that is 64% wrong stops being read, and the real rot hides in the noise.
        # Network-free — every request is faked.
        run: python3 scripts/test_check_links.py

      - name: check-links.py mutation test (can the suite go red?)
        # Pins issue #102. The suite above was 10/10 green while
        # `sys.exit(1 if failures else 0)` -> `sys.exit(0)` survived: the gate
        # could have been made permanently green with no test noticing. Green is
        # not evidence a test can fail, so this runs the suite against 22 known
        # defects and requires every one to be caught. Network-free; restores
        # check-links.py in a finally block.
        run: python3 scripts/mutate_check_links.py

      - name: check-duplicate-repos.py (same repo listed twice in one table)
        # 2026-08-23: microsoft/agent-framework was added to the Stage 4 table
        # as new when it had been in that same table since 2026-06-13. Stars,
        # license and push date were verified; the slug was never grepped, and
        # all six content gates stayed green because the only entry-counting
        # gate is scoped to resources/mcp-skills-catalog.* and cannot see a
        # stage's prose table. Compares within one table or list only, using
        # each row's first link, so cross-references and monorepo subdirectory
        # entries are not reported. stdlib-only, network-free.
        run: python3 scripts/check-duplicate-repos.py --quiet

      - name: check-duplicate-repos.py unit tests
        run: python3 scripts/test_duplicate_repos.py

      - name: zh-hans-localize.py substitution rule tests
        # This gate REWRITES tracked files, and until 2026-08-14 nothing tested
        # its substitution logic — the #102 shape. The cost was concrete:
        # 影片→视频 was dropped from VOCAB because 影片 is a substring of 投影片
        # (slides) and a blanket replace yields 投视频, so five genuine Taiwan
        # residues sat in tracked files while the gate reported "clean". The
        # rule is now guarded by a separator run that stops at a paragraph
        # break (a bare lookbehind was tried first and is NOT enough — ordinary
        # markdown like 投**影片** defeats literal adjacency). These tests pin
        # BOTH halves: the term is localized AND the host word is not corrupted.
        # stdlib-only, network-free.
        run: python3 scripts/test_zh_hans_localize.py

      - name: check-anchors.py fenced-code-block parser tests
        # Pins issue #95: strip_code_blocks used to toggle on any ``` line,
        # which disagrees with CommonMark and therefore with the renderer that
        # publishes the site. Four headings were rendering as code in
        # examples/stage-4/04-codeact-vs-json-tool/README.* while every gate
        # read green. check-anchors.py itself CANNOT catch that — under the old
        # parser it still exits 0 — so these unit tests are the only guard.
        # stdlib-only, network-free.
        run: python3 scripts/test_check_anchors.py

  link-rot:
    name: Link rot check (GitHub URLs)
    runs-on: ubuntu-latest
    # 只在 schedule 跟 workflow_dispatch 跑——PR 跑會太慢
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run link-check (full — every URL, not just GitHub)
        # Was `--fast`, which filters to github.com. That meant NOTHING in CI ever
        # executed the host-block probe, the 404/410 guard or the unverifiable
        # bucket, because github.com's root answers 200 — all five dead links in
        # issue #94 were only findable by running this by hand.
        #
        # This job is already `if: schedule || workflow_dispatch` (see above), so
        # full mode costs zero PR latency; it only affects the monthly cron. And
        # it is affordable now precisely because the report is triaged into
        # Failed vs Unverifiable, so a refusal no longer turns the job red.
        run: python scripts/check-links.py --quiet

  star-drift:
    name: Star drift detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run refresh-stars (warn only, don't fail CI)
        # gh CLI 已內建在 ubuntu-latest runner，GH_TOKEN 自動 set
        # 高門檻 (50%) 才警告，避免每月誤報
        run: |
          # 用 --check 才會在 drift 時退 1；用 || 接 ::warning:: 退 0
          if ! python scripts/refresh-stars.py --threshold 50 --check; then
            echo "::warning::Star drift detected (>=50%). 跑 'python scripts/refresh-stars.py' 看哪些 entry 要更新。"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  freshness-tests:
    name: Freshness gate unit tests
    runs-on: ubuntu-latest
    # Runs on every PR and every push to main (no paths filter, no schedule-only
    # guard), so the freshness-gate coverage can't silently regress the way it
    # did in 2026-07.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run freshness gate regression tests
        # Pins the 2026-07 coverage fixes: mirror-locale scanning +
        # DeepSeek space-form regex (scripts/test_freshness.py).
        run: python scripts/test_freshness.py

  anchor-slug-parity:
    name: Anchor slug parity (site vs check-anchors)
    runs-on: ubuntu-latest
    # Its own job because it needs the real mkdocs config loader — it asks
    # mkdocs.yml what slugify the SITE will use, rather than assuming. The
    # other lint steps are stdlib-only and must not pay for that install.
    #
    # Guards issue #93: check-anchors.py validates GitHub's slug rules while
    # the site used python-markdown's default, which strips non-ASCII. The
    # gate read green while 151 fragments were dead on the published site.
    # Runs on every PR — docs.yml would be too late, it only fires on push
    # to main, i.e. after the merge.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        # The same requirement set the site build installs, so the slugify
        # under test is the one that will actually render the site. Note
        # pymdown-extensions is pinned explicitly in requirements-docs.txt
        # precisely because toc.slugify resolves through it.
        run: pip install -r requirements-docs.txt

      - name: Stage content tree
        # mkdocs.yml sets docs_dir: _build/docs, which is gitignored. The test
        # reads the real config via mkdocs.config.load_config, and load_config
        # VALIDATES docs_dir existence — so on a fresh checkout it aborts before
        # the parity assertion ever runs. Locally this passed only because a
        # previous build had left _build/docs behind.
        run: python scripts/build-docs-tree.py

      - name: Site and gate must agree on every heading slug
        run: python scripts/test_anchor_slug_parity.py
