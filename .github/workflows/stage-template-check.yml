name: Stage Template Check

# 驗 stages/*.md 有所有必要 H2 section（template 對齊）。
# REQUIRED 缺則 fail PR、EXPECTED 缺則 warning（不擋）。

on:
  # 刻意「不」加 paths 過濾。這是 blocking gate，將來可能被設成 required status check；
  # 而 GitHub 對「required 但從未回報」的 check 是無限期等待，PR 會永遠卡在
  # 「Expected — Waiting for status to be reported」。paths 過濾會讓整個 workflow 不觸發、
  # 連 check 物件都不產生，正是那個死鎖。
  # （job 層的 `if:` 不一樣——被 skip 的 job 仍然會回報一個 skipped 的 check，GitHub 視為
  # 通過，所以那種 guard 是安全的。本檔沒有用到 job 層 `if:`。）
  # 這個 filter（`stages/**.md`）原本讓 442 / 473 個 tracked 檔案觸發不了任何一次執行，
  # 也就是 93% 的 repo（examples/ 198、resources/ 115、root 36、scripts/ 32、.github/ 30、
  # branches/ 16、tracks/ 9、docs/ 3、walkthroughs/ 3）。三者之中它的死鎖面最大。
  # 這份 workflow 實測 6-7 秒（3 次觀測），省下的 CI 時間遠不值得這個風險。
  pull_request:
  # 也在 push 到 main 時跑。2026-06-07 → 2026-08-04 的 109 個 commit 只有 14 個經由 PR
  # 進來（比對已 merge PR 的 merge-commit sha），其餘 95 個是直接推 main——沒有 push
  # trigger 的話，這個 gate 在那條佔 87% 的路徑上等於不存在。lint.yml 同日先做了同樣的事。
  push:
    branches: [main]
  schedule:
    # 每月 1 號 UTC 06:00。這是三個 gate 裡唯一原本連 schedule 都沒有的——
    # 加上 push 之後 PR 與直接推都有覆蓋，這個 cron 是獨立心跳：即使沒人改動，
    # 也每月證明一次 gate 本身還能跑。時段避開 lint 03:00 / anchor 04:00 / freshness 05:00。
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read  # explicit minimal permission

jobs:
  template:
    name: Validate stage template structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install reader UX checker dependency
        run: pip install --require-hashes -r scripts/requirements-reader-ux.txt

      - name: Test reader UX ratchet
        run: python scripts/test_reader_ux.py

      - name: Validate migrated-page reader UX
        run: python scripts/check-reader-ux.py

      - name: Validate stage template
        run: python scripts/check-stage-template.py
